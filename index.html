    function StarfieldBackground() {
      const canvasRef = React.useRef(null);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const stars = Array.from({ length: 140 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.8 + 0.3,
          baseAlpha: Math.random() * 0.7 + 0.2,
          alpha: Math.random() * 0.7 + 0.2,
          speed: Math.random() * 0.02 + 0.005,
          color: Math.random() > 0.4 ? '#38bdf8' : '#ffffff'
        }));

        let mouse = { x: -1000, y: -1000 };

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };

        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove);

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          stars.forEach((star) => {
            star.alpha += Math.sin(Date.now() * star.speed) * 0.01;
            if (star.alpha < 0.1) star.alpha = 0.1;
            if (star.alpha > 0.9) star.alpha = 0.9;

            const dx = mouse.x - star.x;
            const dy = mouse.y - star.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            let sizeOffset = 0;

            if (dist < 120) {
              sizeOffset = (1 - dist / 120) * 1.5;
            }

            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size + sizeOffset, 0, Math.PI * 2);
            ctx.fillStyle = star.color;
            ctx.globalAlpha = star.alpha;
            ctx.shadowBlur = dist < 120 ? 8 : 0;
            ctx.shadowColor = '#38bdf8';
            ctx.fill();
            ctx.shadowBlur = 0;
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0"
        />
      );
    }

        const rotateX = (mouseY / (card.height / 2)) * -12;
        const rotateY = (mouseX / (card.width / 2)) * 12;

        setRotate({ x: rotateX, y: rotateY });

        setHoveredBar(null);

                <h2 className="text-3xl font-bold text-white">Our Professional Services</h2>
                <p className="text-slate-400 text-sm mt-3">We design and develop high-performance digital products tailored for modern market demands.</p>
              </div>

              <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                {SERVICES_DATA.map((serv) => (
                  <div
                    key={serv.id}
                    className="p-6 rounded-2xl bg-[#09152b]/90 border border-slate-800 hover:border-cyan-500/50 hover:shadow-xl hover:shadow-cyan-500/5 transition-all duration-300 group backdrop-blur-md text-left"
                  >
                    <div className="p-3 rounded-xl bg-slate-900/80 w-fit mb-4 text-cyan-400 group-hover:scale-110 transition-transform">
                      <i data-lucide={serv.iconName} className="w-8 h-8"></i>
                    </div>
                    <h3 className="text-lg font-bold text-white mb-2">{serv.title}</h3>
                    <p className="text-slate-400 text-xs leading-relaxed">{serv.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ================= GROWTH STATS SECTION ================= */}
          <section id="growth" className="relative z-10 py-24 max-w-7xl mx-auto px-6">
            <div className="text-center max-w-2xl mx-auto mb-12">
              <span className="text-xs font-mono text-cyan-400 tracking-wider">REAL-TIME PERFORMANCE</span>
              <h2 className="text-3xl font-bold text-white mt-2">Performance & Growth Indicators</h2>
            </div>

            <div className="grid md:grid-cols-3 gap-8">
              {GROWTH_STATS.map((stat, idx) => (
                <div key={idx} className="p-8 rounded-2xl bg-[#09152b]/90 backdrop-blur-md border border-slate-800 text-center space-y-3 relative overflow-hidden group hover:border-cyan-500/40 transition-all">
                  <div className="text-4xl font-black text-cyan-400">{stat.value}</div>
                  <h3 className="text-lg font-bold text-white">{stat.title}</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">{stat.desc}</p>
                </div>
              ))}
            </div>
          </section>

          {/* ================= PORTFOLIO SECTION ================= */}
          <section id="portfolio" className="relative z-10 py-24 bg-[#050e1f]/80 backdrop-blur-sm border-t border-slate-800/60">
            <div className="max-w-7xl mx-auto px-6">
              <div className="flex flex-col md:flex-row md:items-end justify-between mb-12">
                <div className="text-left">
                  <h2 className="text-3xl font-bold text-white">Project Portfolio</h2>
                  <p className="text-slate-400 text-sm mt-2">Explore our latest digital products and web solutions.</p>
                </div>
                <div className="mt-4 md:mt-0">
                  <span className="text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg">
                    Total Projects: {projects.length}
                  </span>
                </div>
              </div>

              <div className="grid md:grid-cols-3 gap-8">
                {projects.map((project) => (
                  <div
                    key={project.id}
                    className="rounded-2xl bg-[#09152b]/90 backdrop-blur-md border border-slate-800 overflow-hidden shadow-lg hover:border-slate-700 transition-all flex flex-col justify-between text-left"
                  >
                    <div>
                      <div className="relative h-48 overflow-hidden">
                        <img
                          src={project.image}
                          alt={project.title}
                          className="w-full h-full object-cover"
                        />
                        <div className="absolute top-3 left-3 bg-black/70 backdrop-blur-md px-2.5 py-1 rounded-md text-[10px] text-cyan-300 font-semibold uppercase">
                          {project.category}
                        </div>
                      </div>

                      <div className="p-6 space-y-3">
                        <h3 className="text-lg font-bold text-white">{project.title}</h3>
                        <p className="text-slate-400 text-xs leading-relaxed">{project.description}</p>
                      </div>
                    </div>

                    <div className="p-6 pt-0 flex items-center justify-start border-t border-slate-800/50 mt-4">
                      {/* Live Preview Button with 3D LED Glow Effect */}
                      <a
                        href={project.link}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="relative inline-flex items-center justify-center gap-2 px-4 py-2 text-xs font-bold text-white bg-gradient-to-r from-blue-600 to-cyan-500 rounded-xl shadow-[0_4px_0_0_#1e40af,_0_8px_16px_rgba(6,182,212,0.3)] hover:shadow-[0_2px_0_0_#1e40af,_0_4px_25px_rgba(6,182,212,0.6)] hover:translate-y-[2px] active:translate-y-[4px] active:shadow-none transition-all duration-150 group overflow-hidden border border-cyan-400/30"
                      >
                        <span className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out"></span>
                        <span className="relative z-10">Live Preview</span>
                        <i data-lucide="external-link" className="w-3.5 h-3.5 relative z-10 group-hover:rotate-12 transition-transform duration-200"></i>
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ================= CONTACT SECTION ================= */}
          <section id="contact" className="relative z-10 py-24 max-w-7xl mx-auto px-6">
            <div className="grid lg:grid-cols-12 gap-12 items-center">
              
              {/* Contact Info Text */}
              <div className="lg:col-span-5 space-y-6 text-left">
                <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyan-950/80 border border-cyan-500/30 text-cyan-300 text-xs font-semibold">
                  <i data-lucide="mail" className="w-3.5 h-3.5"></i>
                  <span>Contact Us</span>
                </div>

                <h2 className="text-3xl md:text-4xl font-extrabold text-white">
                  Have a project in mind? <br />
                  <span className="bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    Let's talk today.
                  </span>
                </h2>

                <p className="text-slate-400 text-sm leading-relaxed">
                  We are here to help turn your ideas into intelligent, automated digital reality. Send us a message and we'll respond promptly.
                </p>

                <div className="space-y-4 pt-4">
                  <div className="flex items-center gap-4 p-4 rounded-xl bg-[#09152b]/80 border border-slate-800">
                    <div className="p-3 rounded-lg bg-cyan-500/10 text-cyan-400">
                      <i data-lucide="mail" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <p className="text-xs text-slate-400">Direct Email</p>
                      <a href={`mailto:${CONTACT_EMAIL}`} className="text-sm font-semibold text-white hover:text-cyan-400 transition-colors">
                        {CONTACT_EMAIL}
                      </a>
                    </div>
                  </div>

                  <div className="flex items-center gap-4 p-4 rounded-xl bg-[#09152b]/80 border border-slate-800">
                    <div className="p-3 rounded-lg bg-cyan-500/10 text-cyan-400">
                      <i data-lucide="clock" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <p className="text-xs text-slate-400">Working Hours</p>
                      <p className="text-sm font-semibold text-white">Mon - Fri: 9:00 AM - 6:00 PM</p>
                    </div>
                  </div>
                </div>
              </div>

              {/* Contact Form */}
              <div className="lg:col-span-7">
                <div className="p-8 rounded-3xl bg-[#09152b]/90 border border-slate-800 shadow-2xl backdrop-blur-xl">
                  <form onSubmit={handleFormSubmit} className="space-y-5">
                    <div className="grid md:grid-cols-2 gap-5">
                      <div className="space-y-2 text-left">
                        <label className="text-xs font-semibold text-slate-300">Full Name</label>
                        <input
                          type="text"
                          required
                          placeholder="John Doe"
                          className="w-full bg-[#040c1a] border border-slate-800 focus:border-cyan-500 rounded-xl p-3.5 text-sm text-white focus:outline-none transition-colors"
                        />
                      </div>
                      <div className="space-y-2 text-left">
                        <label className="text-xs font-semibold text-slate-300">Email Address</label>
                        <input
                          type="email"
                          required
                          placeholder="example@domain.com"
                          className="w-full bg-[#040c1a] border border-slate-800 focus:border-cyan-500 rounded-xl p-3.5 text-sm text-white focus:outline-none transition-colors"
                        />
                      </div>
                    </div>

                    <div className="space-y-2 text-left">
                      <label className="text-xs font-semibold text-slate-300">Subject</label>
                      <input
                        type="text"
                        required
                        placeholder="How can we help you?"
                        className="w-full bg-[#040c1a] border border-slate-800 focus:border-cyan-500 rounded-xl p-3.5 text-sm text-white focus:outline-none transition-colors"
                      />
                    </div>

                    <div className="space-y-2 text-left">
                      <label className="text-xs font-semibold text-slate-300">Message Details</label>
                      <textarea
                        required
                        rows="4"
                        placeholder="Write your project details or inquiries here..."
                        className="w-full bg-[#040c1a] border border-slate-800 focus:border-cyan-500 rounded-xl p-3.5 text-sm text-white focus:outline-none transition-colors resize-none"
                      ></textarea>
                    </div>

                    <button
                      type="submit"
                      disabled={formStatus === 'sending'}
                      className="relative w-full inline-flex items-center justify-center gap-2 py-4 text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-cyan-500 rounded-xl shadow-[0_4px_0_0_#1e40af,_0_8px_16px_rgba(6,182,212,0.3)] hover:shadow-[0_2px_0_0_#1e40af,_0_4px_25px_rgba(6,182,212,0.6)] hover:translate-y-[2px] active:translate-y-[4px] active:shadow-none transition-all duration-150 group overflow-hidden border border-cyan-400/30"
                    >
                      <span className="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700 ease-in-out"></span>
                      {formStatus === 'sending' ? (
                        <span className="relative z-10">Sending Message...</span>
                      ) : formStatus === 'success' ? (
                        <span className="relative z-10 text-emerald-300">Your message has been sent!</span>
                      ) : (
                        <>
                          <span className="relative z-10">Send Message</span>
                          <i data-lucide="send" className="w-4 h-4 relative z-10 group-hover:translate-x-1 transition-transform duration-200"></i>
                        </>
                      )}
                    </button>
                  </form>
                </div>
              </div>

            </div>
          </section>

          {/* ================= FOOTER ================= */}
          <footer className="relative z-10 border-t border-slate-800/80 bg-[#02060d] py-12">
            <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6 text-xs text-slate-500">
              <div className="flex items-center gap-3">
                <div className="flex items-center justify-center w-8 h-8 bg-cyan-500/10 rounded-lg text-cyan-400">
                  <i data-lucide="zap" className="w-4 h-4"></i>
                </div>
                <span className="font-bold text-slate-300">VELTIX Solutions</span>
              </div>
              <p>© {new Date().getFullYear()} VELTIX. All rights reserved.</p>
              <div className="flex gap-6">
                <a href="#home" className="hover:text-cyan-400 transition-colors">Home</a>
                <a href="#services" className="hover:text-cyan-400 transition-colors">Services</a>
                <a href="#portfolio" className="hover:text-cyan-400 transition-colors">Portfolio</a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render Component
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>

</html>
